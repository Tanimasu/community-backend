# 应用跑在容器里时使用的配置（SPRING_PROFILES_ACTIVE=docker）
# 与默认配置的唯一区别：主机名从 localhost 换成 docker-compose 里的服务名。
# 容器里的 localhost 指的是容器自己，不是宿主机，所以必须用服务名互相访问
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/community_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
  data:
    redis:
      host: redis
  rabbitmq:
    host: rabbitmq

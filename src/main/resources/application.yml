spring:
  application:
    name: community-backend
  datasource:
    # allowPublicKeyRetrieval=true：MySQL 8 默认用 caching_sha2_password 认证，
    # 不走 SSL 时驱动需要向服务端索取公钥来加密密码，否则报 Public Key Retrieval is not allowed。
    # 仅适用于本地开发，生产环境应该改用 SSL 连接
    url: jdbc:mysql://localhost:3306/community_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: community
    password: community1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: community
    password: community1234
    listener:
      simple:
        # 消费失败时最多重试 3 次；重试用尽后不再放回队列，而是进入死信队列
        # 不这样配的话，失败的消息会被无限重新投递，日志会被刷爆
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s

jwt:
  # 开发用密钥，至少 32 个字节；生产环境通过环境变量 JWT_SECRET 覆盖
  secret: ${JWT_SECRET:community-backend-dev-only-secret-key-please-change-in-prod}
  access-token-ttl: 15m
  refresh-token-ttl: 7d

server:
  port: 8080